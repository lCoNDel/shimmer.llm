name: 2-desarrollo

services:

  # clon de open-webui para desarrollo y tests extremos — comparte volumen con prod
  # no usar simultáneamente con open-webui (prod) para evitar conflictos en el volumen
  open-webui-dev:
    image: ghcr.io/open-webui/open-webui:v0.9.6
    container_name: open-webui-dev
    restart: "no"
    ports:
      - "3002:3000"
    volumes:
      - open-webui:/app/backend/data
      - C:\Users\luisc\Documents\GitHub\shimmer.llm\proyectos\.docker\branding\custom.css:/app/build/static/custom.css:ro
      - C:\Users\luisc\Documents\GitHub\shimmer.llm\proyectos\.docker\branding\favicon.png:/app/build/static/favicon.png:ro
      - C:\Users\luisc\Documents\GitHub\shimmer.llm\proyectos\.docker\branding\favicon.png:/app/build/static/favicon-96x96.png:ro
    environment:
      - PORT=3000
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - ENABLE_OPENAI_API_PASSTHROUGH=true
      - WEBUI_NAME=Touron LLM

volumes:
  open-webui:
    external: true
