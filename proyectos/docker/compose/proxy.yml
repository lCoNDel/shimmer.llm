name: 3-proxy

services:

  # servidor tsamaps + proxy hacia open webui
  # proyecto EOL — solo se arranca puntualmente para demos (ops/tsamaps-demo-start.ps1)
  tsamaps_server:
    image: python:3.11-slim
    container_name: tsamaps_server
    restart: "no"
    ports:
      - "5050:5050"
    volumes:
      - ../../webapps/antiguos/tsamaps:/app
      - ../../docker/certs:/certs:ro
    working_dir: /app
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: sh -c "pip install fastapi uvicorn httpx ddgs -q && uvicorn server:app --host 0.0.0.0 --port 5050 --ssl-certfile /certs/pc-luis.bandicoot-stairs.ts.net.crt --ssl-keyfile /certs/pc-luis.bandicoot-stairs.ts.net.key"
